<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>微信登录模块测试</title>
  <script src="../js/vconsole-loader.js"></script>
  <!-- 微信JSSDK -->
  <script src="https://res.wx.qq.com/open/js/jweixin-1.6.0.js"></script>
  <!-- 明道云API组件 -->
  <script src="../js/api/MingdaoQuery.js"></script>
  <script src="../js/api/MingdaoAdd.js"></script>
  <script src="../js/api/MingdaoUpdate.js"></script>
  <script src="../js/api/MingdaoArray.js"></script>
  <!-- 登录模块 -->
  <script src="./WechatLogin.js"></script>
</head>

<body>
  <div class="container">
    <h1>微信小程序Webview登录测试</h1>

    <div id="user-info">
      <p>用户状态：<span id="login-status">未登录</span></p>
      <p>用户姓名：<span id="user-name">-</span></p>
      <p>用户头像：<img id="user-avatar" src="" alt="头像" style="width: 50px; height: 50px; display: none;"></p>
    </div>

    <div id="login-buttons">
      <button id="btn-login">登录</button>
      <button id="btn-logout" style="display: none;">退出登录</button>
      <button id="btn-debug">调试信息</button>
      <button id="btn-test-login">测试登录</button>
    </div>
  </div>

  <script src="./login-test.js"></script>
</body>

</html>
