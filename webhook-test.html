<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>明道云 Webhook 测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        textarea {
            height: 200px;
            font-family: monospace;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        .response {
            margin-top: 20px;
            padding: 15px;
            background-color: #f5f5f5;
            border-radius: 4px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 12px;
        }
        .success {
            border-left: 4px solid #4CAF50;
        }
        .error {
            border-left: 4px solid #f44336;
        }
        .info {
            background-color: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>📡 明道云 Webhook 测试</h1>
    
    <div class="info">
        <strong>目标地址：</strong> <code id="targetUrl">http://10.0.192.138:3003/mingdao-webhook</code><br>
        <strong>请求方法：</strong> <code>POST</code><br>
        <strong>内容类型：</strong> <code>application/json</code>
    </div>

    <div class="form-group">
        <label for="url">Webhook URL:</label>
        <input type="text" id="url" value="http://10.0.192.138:3003/mingdao-webhook">
    </div>

    <div class="form-group">
        <label for="jsonData">JSON 数据（模拟明道云格式）:</label>
        <textarea id="jsonData">{
  "id": "68da906bd34347b006235da5-hello123",
  "content": "hello123",
  "sender": {
    "id": "ff074b4e-92ad-466e-9018-d3a7d150e8ee",
    "name": "林东城"
  },
  "conversation": "68da90934256d51497bb9ff9-test",
  "created_at": "2026-03-02T04:30:00.000Z",
  "fields": {
    "68da906bd34347b006235da5": "hello123",
    "692d147433260875c1970b8a": ["ff074b4e-92ad-466e-9018-d3a7d150e8ee"],
    "692d166992609b5d9de82b58": 1772424600000
  }
}</textarea>
    </div>

    <button onclick="sendWebhook()">🚀 发送测试</button>

    <div id="response" class="response" style="display:none;"></div>

    <script>
        async function sendWebhook() {
            const url = document.getElementById('url').value;
            const jsonData = document.getElementById('jsonData').value;
            const responseDiv = document.getElementById('response');
            
            responseDiv.style.display = 'block';
            responseDiv.className = 'response';
            responseDiv.textContent = '⏳ 发送中...';
            
            const startTime = Date.now();
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: jsonData
                });
                
                const endTime = Date.now();
                const delay = endTime - startTime;
                
                const text = await response.text();
                
                let result = `✅ 响应状态：${response.status} ${response.statusText}\n`;
                result += `⏱️  请求耗时：${delay}ms\n`;
                result += `\n📥 响应内容：\n${text}`;
                
                if (response.ok) {
                    responseDiv.className = 'response success';
                } else {
                    responseDiv.className = 'response error';
                }
                
                responseDiv.textContent = result;
                
            } catch (error) {
                responseDiv.className = 'response error';
                responseDiv.textContent = `❌ 请求失败：${error.message}\n\n请检查：\n1. 服务器是否运行 (node mingdao-webhook-test.js)\n2. URL 是否正确\n3. 网络连接是否正常\n4. 如果是跨域问题，查看浏览器控制台`;
            }
        }
    </script>
</body>
</html>
