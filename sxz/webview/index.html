<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陪诊助手</title>
    <!-- 引入 vConsole 方便调试 -->
    <script src="https://unpkg.com/vconsole@latest/dist/vconsole.min.js"></script>
    <script>var vConsole = new VConsole();</script>
     <!-- 引入 Markdown 渲染库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://res.wx.qq.com/open/js/jweixin-1.6.0.js"></script>
    <link rel="stylesheet" href="styles.css">
    <!-- 复用组件：用户数据获取 -->
    <script src="../mingdao/MingdaoQuery.js"></script>
    <script src="../mingdao/MingdaoAdd.js"></script>
    <script src="../mingdao/MingdaoUpdate.js"></script>
    <script src="../mingdao/MingdaoArray.js"></script>
</head>
<body>
    <div id="app" class="app-container">
        <!-- 新手引导 -->
        <div id="onboarding" class="onboarding-modal hidden">
            <div class="onboarding-content">
                <div class="onboarding-header">
                    <h2>欢迎使用陪诊助手</h2>
                    <button class="close-btn" onclick="closeOnboarding()">&times;</button>
                </div>
                <div class="onboarding-body">
                    <div class="onboarding-step" data-step="1">
                        <div class="step-icon">🤖</div>
                        <h3>智能AI助手</h3>
                        <p>随时为您解答陪诊相关问题，提供专业建议和话术指导</p>
                    </div>
                    <div class="onboarding-step hidden" data-step="2">
                        <div class="step-icon">👥</div>
                        <h3>患者管理</h3>
                        <p>记录患者信息，管理陪诊记录，一键生成诊后报告</p>
                    </div>
                    <div class="onboarding-step hidden" data-step="3">
                        <div class="step-icon">📋</div>
                        <h3>备忘录</h3>
                        <p>设置提醒，管理待办事项，不错过任何重要安排</p>
                    </div>
                    <div class="onboarding-step hidden" data-step="4">
                        <div class="step-icon">⚙️</div>
                        <h3>个性化设置</h3>
                        <p>自定义您的使用体验，让工作更高效</p>
                    </div>
                </div>
                <div class="onboarding-footer">
                    <div class="step-indicators">
                        <span class="indicator active" data-step="1"></span>
                        <span class="indicator" data-step="2"></span>
                        <span class="indicator" data-step="3"></span>
                        <span class="indicator" data-step="4"></span>
                    </div>
                    <button class="btn btn-primary" onclick="nextOnboardingStep()">下一步</button>
                </div>
            </div>
        </div>

        <!-- 主内容区域 -->
        <div id="main-content" class="main-content">
            <!-- 页面内容将动态加载到这里 -->
        </div>

        <!-- 底部导航 -->
        <nav class="bottom-nav">
            <button class="nav-item active" data-tab="ai" onclick="switchTab('ai')">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5"/>
                    <path d="M2 12l10 5 10-5"/>
                </svg>
                <span>智能体</span>
            </button>
            <button class="nav-item" data-tab="patients" onclick="switchTab('patients')">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
                <span>患者库</span>
            </button>
            <button class="nav-item" data-tab="records" onclick="switchTab('records')">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
                <span>备忘录</span>
            </button>
            <button class="nav-item" data-tab="settings" onclick="switchTab('settings')">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M12 1v6m0 6v6m5.196-15.804L15.5 7.5m-7 7l-1.696 1.696M23 12h-6m-6 0H1m20.804-5.196L19.5 8.5m-7 7l-1.696 1.696"/>
                </svg>
                <span>设置</span>
            </button>
        </nav>
    </div>

    <script src="https://res.wx.qq.com/open/js/jweixin-1.6.0.js"></script>
    <script src="js/WechatLogin.js"></script>
    <script src="app.js"></script>
</body>
</html>
