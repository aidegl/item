server { 
    listen 80; 
    listen 443 ssl ; 
    http2 on;
    server_name 100000whys.cn; 
 
    index index.html index.htm index.php default.php default.htm default.html; 
    root /www/wwwroot/100000whys.cn; 
    include /www/server/panel/vhost/nginx/extension/100000whys.cn/*.conf; 
 
    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则 
    #error_page 404/404.html; 
    ssl_certificate    /www/server/panel/vhost/cert/100000whys.cn/fullchain.pem; 
    ssl_certificate_key    /www/server/panel/vhost/cert/100000whys.cn/privkey.pem; 
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3; 
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5; 
    ssl_prefer_server_ciphers on; 
    ssl_session_tickets on; 
    ssl_session_cache shared:SSL:10m; 
    ssl_session_timeout 10m; 
    add_header Strict-Transport-Security "max-age=31536000"; 
    add_header Alt-Svc 'quic=":443"; h3=":443"; h3-29=":443"; h3-27=":443";h3-25=":443"; h3-T050=":443"; h3-Q050=":443";h3-Q049=":443";h3-Q048=":443"; h3-Q046=":443"; h3-Q43=":443"'; 
    error_page 497  https://$host$request_uri; 
    #SSL-END 
 
    # ERROR-PAGE-START 错误页配置，可以注释、删除或修改 
    #error_page 404 /404.html; 
    #error_page 502 /502.html; 
    # ERROR-PAGE-END 
 
    # PHP-INFO-START PHP引用配置，可以注释或修改 
    include enable-php-82.conf; 
    # PHP-INFO-END 
 
    # REWRITE-START URL重写规则引用，修改后将导致面板设置的伪静态规则失效 
    include /www/server/panel/vhost/rewrite/100000whys.cn.conf; 
    # REWRITE-END 
 
    # 禁止访问的文件或目录 
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) { 
        return 404; 
    } 
 
    # 一键申请SSL证书验证目录相关设置 
    location ~ \.well-known { 
        allow all; 
    } 
    
    # 允许访问 tmp 目录中的临时文件 
    location ^~ /project/shenxianzi/webview/dist/tmp/ { 
        alias /www/wwwroot/100000whys.cn/project/sxz/webview/dist/tmp/; 
        autoindex off; 
        types { 
            image/jpeg jpg jpeg; 
            image/png png; 
            image/gif gif; 
            image/webp webp; 
            application/pdf pdf; 
        } 
        add_header Cache-Control "no-cache, no-store, must-revalidate"; 
        add_header Pragma "no-cache"; 
        add_header Expires "0"; 
    } 
    
    # 将 /api/upload 映射到 /api/tmp.php 
    location = /api/upload { 
        rewrite ^/api/upload$ /api/tmp.php last; 
    } 

    # 小程序登录接口（3003 端口，优先于 /api/ 匹配）
    location /api/core/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
 
    # 小程序生成器API反向代理 
    location /api/ { 
        # 排除已有的PHP路由 
        location ~ ^/api/(upload|tmp\.php) { 
            try_files $uri $uri/ =404; 
        } 
         
        proxy_pass http://127.0.0.1:3001/api/; 
        proxy_http_version 1.1; 
        proxy_set_header Host $host; 
        proxy_set_header X-Real-IP $remote_addr; 
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; 
        proxy_set_header X-Forwarded-Proto $scheme; 
        proxy_connect_timeout 300s; 
        proxy_send_timeout 300s; 
        proxy_read_timeout 300s; 
    } 
     
    # 小程序下载反向代理（用 $request_uri 透传完整路径，避免 /download/xxx 变成 /downloadxxx）
    location /download/ { 
        proxy_pass http://127.0.0.1:3001$request_uri; 
        proxy_http_version 1.1; 
        proxy_set_header Host $host; 
        proxy_set_header X-Real-IP $remote_addr; 
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; 
        proxy_set_header X-Forwarded-Proto $scheme; 
        proxy_buffering off; 
        proxy_max_temp_file_size 0; 
    } 
     
    # 健康检查 
    location /health { 
        proxy_pass http://127.0.0.1:3001/health; 
        proxy_http_version 1.1; 
        proxy_set_header Host $host; 
        access_log off; 
    } 
  
    # 小程序生成器装修页面
    location /decoration.html {
        proxy_pass http://127.0.0.1:3001/decoration.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
  
    # 静态资源缓存 
    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$ { 
        expires 30d; 
        access_log off; 
    } 
  
    location ~ .*\.(js|css)?$ { 
        expires 12h; 
        access_log off; 
    } 
  
    # 访问日志 
    access_log /www/wwwlogs/100000whys.cn.log; 
    error_log  /www/wwwlogs/100000whys.cn.error.log; 
}