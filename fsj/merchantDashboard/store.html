<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>店铺资料</title>
  <script>
    (function () {
      var v = new URLSearchParams(window.location.search).get('v') || new Date().getTime();

      document.write('<link rel="stylesheet" href="store.css?v=' + v + '">');

      var scripts = ['../mingdao/MingdaoArray.js', 'store.js'];
      scripts.forEach(function (src) {
        document.write('<script src="' + src + '?v=' + v + '"><\/script>');
      });
    })();
  </script>
  <script>
    window.addEventListener('load', function () {
      var merchantData = localStorage.getItem('merchantData');
      if (merchantData) {
        try {
          var data = JSON.parse(merchantData);
          console.log('[localStorage] 加载成功:', data);

          if (data.logo) {
            var logoArray = JSON.parse(data.logo);
            console.log('[localStorage] logo 数组:', logoArray);

            if (logoArray && logoArray.length > 0) {
              var logoPath = logoArray[0].large_thumbnail_full_path;
              console.log('[localStorage] 图片路径:', logoPath);

              var logoElement = document.querySelector('.logo-preview');
              if (logoElement) {
                logoElement.innerHTML = '<img src="' + logoPath + '" alt="店铺logo" style="width: 100px; height: 100px; object-fit: cover; border-radius: 8px;">';
                console.log('[localStorage] logo已更新');
              }
            }
          }

          if (data.beijing) {
            var noticeElement = document.getElementById('shopNotice');
            if (noticeElement) {
              noticeElement.textContent = data.beijing;
            }
          }

          if (data.jieshao) {
            var descElement = document.getElementById('shopDesc');
            if (descElement) {
              descElement.textContent = data.jieshao;
            }
          }

          if (data.gongsimingcheng) {
            var companyElement = document.getElementById('companyName');
            if (companyElement) {
              companyElement.textContent = data.gongsimingcheng;
            }
          }

          if (data.qiyelianxiren) {
            var contactElement = document.getElementById('contactPerson');
            if (contactElement) {
              contactElement.textContent = data.qiyelianxiren;
            }
          }

          if (data.fuwudianhua) {
            var phoneElement = document.getElementById('servicePhone');
            if (phoneElement) {
              phoneElement.textContent = data.fuwudianhua;
            }
          }

          if (data.qiyedizhi) {
            var addressElement = document.getElementById('companyAddress');
            if (addressElement) {
              addressElement.textContent = data.qiyedizhi;
            }
          }

          if (data.youxiang) {
            var emailElement = document.getElementById('email');
            if (emailElement) {
              emailElement.textContent = data.youxiang;
            }
          }

        } catch (error) {
          console.error('[localStorage] 解析数据失败:', error);
        }
      }
    });
  </script>
</head>

<body>
  <div class="container">
    <div class="section">
      <div class="section-title">店铺信息</div>

      <div class="form-group">
        <label class="form-label">店铺名称</label>
        <div class="form-value" id="shopName">蹦跶熊猫</div>
      </div>

      <div class="form-group">
        <label class="form-label">店铺公告</label>
        <div class="form-textarea" id="shopNotice">欢迎来到蹦跶熊猫的app商城</div>
      </div>

      <div class="form-group">
        <label class="form-label">店铺介绍</label>
        <div class="form-textarea" id="shopDesc">蹦跶熊猫的文创世界</div>
      </div>

      <div class="form-group">
        <label class="form-label">店铺logo</label>
        <div class="logo-preview">店</div>
        <div class="logo-hint">建议长宽：100px*100px</div>
      </div>

      <div class="form-group">
        <label class="form-label">店铺背景</label>
        <div class="background-preview">背景</div>
        <div class="logo-hint">建议尺寸：375px*125px</div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">公司信息</div>
      <div class="company-info">
        <div class="form-group">
          <label class="form-label">公司名称</label>
          <div class="form-value" id="companyName">上海协顺广告有限公司</div>
        </div>

        <div class="form-group">
          <label class="form-label">企业联系人</label>
          <div class="form-value" id="contactPerson">林东城</div>
        </div>

        <div class="form-group">
          <label class="form-label">商家服务电话</label>
          <div class="form-value" id="servicePhone">18017043586</div>
        </div>

        <div class="form-group">
          <label class="form-label">企业地址</label>
          <div class="form-value" id="companyAddress">上海闵行区新镇路603弄</div>
        </div>

        <div class="form-group">
          <label class="form-label">邮箱</label>
          <div class="form-value" id="email">997399840@qq.com</div>
        </div>
      </div>
    </div>

    <button class="edit-btn" onclick="editShopInfo()">编辑资料</button>
  </div>

  <script>
    function getUrlParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        userId: params.get('userId') || '',
        mRowid: params.get('mRowid') || ''
      };
    }

    function loadShopInfo() {
      const params = getUrlParams();

      console.log('获取商家id：?mRowid=' + params.mRowid + '；');

      if (params.mRowid) {
        loadShopData(params.mRowid);
      } else {
        console.warn('[store.html] 未获取到mRowid参数，使用默认数据');
      }
    }

    function editShopInfo() {
      alert('编辑店铺资料功能开发中...');
    }

    window.onload = function () {
      loadShopInfo();
    };
  </script>
</body>

</html>
