<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>门店管理</title>
  <script>
    (function () {
      var v = new URLSearchParams(window.location.search).get('v') || new Date().getTime();

      var scripts = ['../mingdao/MingdaoArray.js', 'store.js'];
      scripts.forEach(function (src) {
        document.write('<script src="' + src + '?v=' + v + '"><\/script>');
      });
    })();
  </script>
  <script>
    window.addEventListener('load', function () {
      var merchantData = localStorage.getItem('merchantData');
      if (merchantData) {
        try {
          var data = JSON.parse(merchantData);
          console.log('[localStorage] 加载成功:', data);

          if (data.logo) {
            var logoArray = JSON.parse(data.logo);
            console.log('[localStorage] logo 数组:', logoArray);

            if (logoArray && logoArray.length > 0) {
              var logoPath = logoArray[0].large_thumbnail_full_path;
              console.log('[localStorage] 图片路径:', logoPath);

              var avatarElement = document.querySelector('.shop-avatar');
              if (avatarElement) {
                avatarElement.innerHTML = '<img src="' + logoPath + '" alt="店铺头像" style="width: 100%; height: 100%; object-fit: cover;">';
                console.log('[localStorage] 头像元素已更新');
              }
            } else {
              console.error('[localStorage] logo 数组为空');
            }
          } else {
            console.error('[localStorage] logo 字段不存在');
          }
        } catch (error) {
          console.error('[localStorage] 解析数据失败:', error);
        }
      } else {
        console.warn('[localStorage] merchantData 不存在，等待数据加载');
      }
    });
  </script>
  <style>
    :root {
      --primary-color: #0557e1ff;
      --primary-hover: #044ac3;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-secondary: #64748b;
      --border-radius: 12px;
      --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 24px;
      line-height: 1.5;
      caret-color: transparent;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .section {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
      border: 1px solid #e2e8f0;
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 20px;
      padding-bottom: 0;
      border-bottom: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-title::before {
      content: '';
      display: block;
      width: 4px;
      height: 18px;
      background: var(--primary-color);
      margin-right: 12px;
      border-radius: 2px;
    }

    .add-btn {
      padding: 8px 20px;
      background: var(--primary-color);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
    }

    .add-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .shop-info {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .shop-avatar {
      width: 80px;
      height: 80px;
      border-radius: 16px;
      background: #e0e7ff;
      color: var(--primary-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .shop-details {
      flex: 1;
    }

    .shop-name {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .shop-meta {
      color: var(--text-secondary);
      font-size: 14px;
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .store-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .store-card {
      background: #fff;
      border-radius: var(--border-radius);
      padding: 20px;
      border: 1px solid #f1f5f9;
      box-shadow: var(--shadow-sm);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .store-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--primary-color);
    }

    .store-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: var(--primary-color);
      opacity: 0.8;
    }

    .store-name {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .store-address {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .store-meta {
      display: flex;
      gap: 12px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .store-status {
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      background: #dcfce7;
      color: #166534;
    }

    .store-status.closed {
      background: #fee2e2;
      color: #991b1b;
    }

    .store-actions {
      margin-top: 16px;
      display: flex;
      gap: 8px;
    }

    .action-btn {
      flex: 1;
      padding: 6px 12px;
      background: #f8fafc;
      color: var(--text-secondary);
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      background: var(--primary-color);
      color: #fff;
      border-color: var(--primary-color);
    }

    @media (max-width: 1200px) {
      .store-list {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 768px) {
      .shop-info {
        flex-direction: column;
        align-items: flex-start;
      }

      .store-list {
        grid-template-columns: 1fr;
      }

      .section-title {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="section">
      <div class="shop-info">
        <div class="shop-avatar">店</div>
        <div class="shop-details">
          <div class="shop-name" id="shopName">加载中...</div>
          <div class="shop-meta">
            <span id="expireTime">到期时间: --</span>
            <span id="shopType">店铺类型: --</span>
          </div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">
        门店列表
        <button class="add-btn" onclick="addStore()">+ 添加门店</button>
      </div>
      <div class="store-list" id="storeList">
        <div class="store-card">
          <div class="store-name">示例门店1</div>
          <div class="store-address">北京市朝阳区建国路88号</div>
          <div class="store-meta">
            <span class="store-status">营业中</span>
            <span>营业时间: 09:00-21:00</span>
          </div>
          <div class="store-actions">
            <button class="action-btn" onclick="editStore(1)">编辑</button>
            <button class="action-btn" onclick="deleteStore(1)">删除</button>
          </div>
        </div>
        <div class="store-card">
          <div class="store-name">示例门店2</div>
          <div class="store-address">北京市海淀区中关村大街1号</div>
          <div class="store-meta">
            <span class="store-status closed">已打烊</span>
            <span>营业时间: 10:00-20:00</span>
          </div>
          <div class="store-actions">
            <button class="action-btn" onclick="editStore(2)">编辑</button>
            <button class="action-btn" onclick="deleteStore(2)">删除</button>
          </div>
        </div>
        <div class="store-card">
          <div class="store-name">示例门店3</div>
          <div class="store-address">北京市西城区西单北大街120号</div>
          <div class="store-meta">
            <span class="store-status">营业中</span>
            <span>营业时间: 08:00-22:00</span>
          </div>
          <div class="store-actions">
            <button class="action-btn" onclick="editStore(3)">编辑</button>
            <button class="action-btn" onclick="deleteStore(3)">删除</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function getUrlParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        userId: params.get('userId') || '',
        mRowid: params.get('mRowid') || ''
      };
    }

    function loadShopInfo() {
      const params = getUrlParams();

      console.log('获取商家id：?mRowid=' + params.mRowid + '；');

      if (params.mRowid) {
        loadShopData(params.mRowid);
      } else {
        console.warn('[store.html] 未获取到mRowid参数，使用默认数据');
      }
    }

    function addStore() {
      alert('添加门店功能开发中...');
    }

    function editStore(storeId) {
      alert('编辑门店功能开发中... 门店ID: ' + storeId);
    }

    function deleteStore(storeId) {
      if (confirm('确定要删除这个门店吗？')) {
        alert('删除门店功能开发中... 门店ID: ' + storeId);
      }
    }

    window.onload = function () {
      loadShopInfo();
    };
  </script>
</body>

</html>
