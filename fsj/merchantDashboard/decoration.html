    function toggleColorPicker(event, key, currentValue) {
      const pickerId = 'colorPicker-' + key;
      const picker = document.getElementById(pickerId);
      if (picker) {
        picker.click();
      }
    }

    function handleColorInputKeypress(event, key, value) {
      if (event.key === 'Enter') {
        event.preventDefault();
        updateGlobalProperty(key, value);
      }
    }

    function handleTabBarColorInputKeypress(event, key, value) {
      if (event.key === 'Enter') {
        event.preventDefault();
        updateTabBarProperty(key, value);
      }
    }

    function isValidColor(color) {
      const s = new Option().style;
      s.color = color;
      return s.color !== '';
    }

    function resolveThemeColor(value) {
      return value === '{主题色}' ? globalConfig.themeColor : value;
    }

    function setThemeTokenForGlobal(key) {
      updateGlobalProperty(key, '{主题色}');
    }

    function setThemeTokenForTabBar(key) {
      updateTabBarProperty(key, '{主题色}');
    }

    function setThemeTokenForContentListTab(key) {
      if (selectedComponent && selectedComponent.componentName === '内容列表') {
        selectedComponent.properties[key] = '{主题色}';

        const resolvedThemeColor = resolveThemeColor('{主题色}') || '#667eea';
        const preview = document.querySelector(`.color-picker-preview[data-color-key="${key}"]`);
        const textInput = document.querySelector(`.color-text-input[data-color-key="${key}"]`);
        const picker = document.querySelector(`.color-picker-input-overlay[data-color-key="${key}"]`);

        if (preview) preview.style.backgroundColor = resolvedThemeColor;
        if (textInput) textInput.value = '{主题色}';
        if (picker) picker.value = resolvedThemeColor;

        renderPreview();
        saveConfig();
      }
    }

    function updateGlobalProperty(key, value) {
      const isThemeToken = value === '{主题色}';
      if (!isThemeToken && !isValidColor(value)) {
        console.warn('无效的颜色值:', value);
        return;
      }

      if (key.includes('.')) {
        const [parent, child] = key.split('.');
        if (!globalConfig[parent]) {
          globalConfig[parent] = {};
        }
        globalConfig[parent][child] = value;
      } else {
        globalConfig[key] = value;
      }
      saveConfig();

      // 更新预览块、输入框和颜色选择器
      let picker = document.querySelector(`.color-picker-input-overlay[data-color-key="${key}"]`);
      let preview = document.querySelector(`.color-picker-preview[data-color-key="${key}"]`);
      let textInput = document.querySelector(`.color-text-input[data-color-key="${key}"]`);

      if (!picker) {
        picker = document.getElementById(`colorPicker-${key}`);
        if (picker) {
          picker.setAttribute('data-color-key', key);
        }
      }
      if (!preview && picker) {
        const wrapper = picker.closest('.color-picker-wrapper');
        if (wrapper) {
          preview = wrapper.querySelector('.color-picker-preview');
          if (preview) {
            preview.setAttribute('data-color-key', key);
          }
        }
      }
      if (!textInput && picker) {
        const wrapper = picker.closest('.color-picker-wrapper');
        if (wrapper) {
          textInput = wrapper.querySelector('.color-text-input');
          if (textInput) {
            textInput.setAttribute('data-color-key', key);
          }
        }
      }

      console.log('[颜色更新] global', key, value, {
        picker: !!picker,
        preview: !!preview,
        textInput: !!textInput
      });

      const resolvedValue = isThemeToken ? resolveThemeColor(value) : value;
      if (picker) picker.value = resolvedValue;
      if (preview) preview.style.backgroundColor = resolvedValue;
      if (textInput) textInput.value = value;

      applyGlobalStyles();
      renderTabBar();
      if (key === 'themeColor') {
        syncColorInputs();
      }
    }

    function updateTabBarProperty(key, value) {
      const isThemeToken = value === '{主题色}';
      if (!isThemeToken && !isValidColor(value)) {
        console.warn('无效的颜色值:', value);
        return;
      }

      tabBarConfig[key] = value;
      saveConfig();

      // 更新预览块、输入框和颜色选择器
      let picker = document.querySelector(`.color-picker-input-overlay[data-color-key="${key}"]`);
      let preview = document.querySelector(`.color-picker-preview[data-color-key="${key}"]`);
      let textInput = document.querySelector(`.color-text-input[data-color-key="${key}"]`);

      if (!picker) {
        picker = document.getElementById(`colorPicker-tabBar.${key}`);
        if (picker) {
          picker.setAttribute('data-color-key', key);
        }
      }
      if (!preview && picker) {
        const wrapper = picker.closest('.color-picker-wrapper');
        if (wrapper) {
          preview = wrapper.querySelector('.color-picker-preview');
          if (preview) {
            preview.setAttribute('data-color-key', key);
          }
        }
      }
      if (!textInput && picker) {
        const wrapper = picker.closest('.color-picker-wrapper');
        if (wrapper) {
          textInput = wrapper.querySelector('.color-text-input');
          if (textInput) {
            textInput.setAttribute('data-color-key', key);
          }
        }
      }

      console.log('[颜色更新] tabbar', key, value, {
        picker: !!picker,
        preview: !!preview,
        textInput: !!textInput
      });

      const resolvedValue = isThemeToken ? resolveThemeColor(value) : value;
      if (picker) picker.value = resolvedValue;
      if (preview) preview.style.backgroundColor = resolvedValue;
      if (textInput) textInput.value = value;

      applyGlobalStyles();
      renderTabBar();
    }

    function applyGlobalStyles() {
      const root = document.documentElement;
      if (globalConfig && globalConfig.themeColor) {
        root.style.setProperty('--primary-color', globalConfig.themeColor);
        root.style.setProperty('--primary-hover', globalConfig.themeColor);
      }

      const navbar = document.getElementById('phoneNavbar');
      const navbarTitle = document.getElementById('navbarTitle');
      const navbarBack = document.getElementById('navbarBack');
      const statusBar = document.querySelector('.phone-status-bar');
      if (navbar && globalConfig && globalConfig.navigationBar) {
        navbar.style.backgroundColor = resolveThemeColor(globalConfig.navigationBar.backgroundColor);
      }
      if (navbarTitle && globalConfig && globalConfig.navigationBar) {
        navbarTitle.style.color = resolveThemeColor(globalConfig.navigationBar.textColor);
      }
      if (navbarBack && globalConfig && globalConfig.navigationBar) {
        navbarBack.style.color = resolveThemeColor(globalConfig.navigationBar.textColor);
        const path = navbarBack.querySelector('path');
        if (path) {
          path.setAttribute('stroke', resolveThemeColor(globalConfig.navigationBar.textColor));
        }
      }
      if (statusBar && globalConfig && globalConfig.navigationBar) {
        statusBar.style.backgroundColor = resolveThemeColor(globalConfig.navigationBar.backgroundColor);
        statusBar.style.color = resolveThemeColor(globalConfig.navigationBar.textColor);
      }

      const tabBar = document.getElementById('tabBar');
      if (tabBar && tabBarConfig) {
        tabBar.style.backgroundColor = resolveThemeColor(tabBarConfig.backgroundColor);
      }
    }

    function syncColorInputs() {
      const globalKeys = [
        'themeColor',
        'navigationBar.backgroundColor',
        'navigationBar.textColor'
      ];
      const tabBarKeys = [
        'backgroundColor',
        'selectedColor',
        'unselectedColor'
      ];

      globalKeys.forEach(key => {
        let value = '';
        if (key.includes('.')) {
          const parts = key.split('.');
          let obj = globalConfig;
          for (let i = 0; i < parts.length; i++) {
            obj = obj ? obj[parts[i]] : '';
          }
          value = obj || '';
        } else {
          value = globalConfig ? globalConfig[key] : '';
        }

        const picker = document.querySelector(`.color-picker-input-overlay[data-color-key="${key}"]`);
        const preview = document.querySelector(`.color-picker-preview[data-color-key="${key}"]`);
        const textInput = document.querySelector(`.color-text-input[data-color-key="${key}"]`);
        const resolvedValue = resolveThemeColor(value);

        if (picker && resolvedValue) {
          picker.value = resolvedValue;
        }
        if (preview && resolvedValue) {
          preview.style.backgroundColor = resolvedValue;
        }
        if (textInput && value) {
          textInput.value = value;
        }
      });

      tabBarKeys.forEach(key => {
        const value = tabBarConfig ? tabBarConfig[key] : '';
        const resolvedValue = resolveThemeColor(value);
        const picker = document.querySelector(`.color-picker-input-overlay[data-color-key="${key}"]`);
        const preview = document.querySelector(`.color-picker-preview[data-color-key="${key}"]`);
        const textInput = document.querySelector(`.color-text-input[data-color-key="${key}"]`);

        if (picker && resolvedValue) {
          picker.value = resolvedValue;
        }
        if (preview && resolvedValue) {
          preview.style.backgroundColor = resolvedValue;
        }
        if (textInput && value) {
          textInput.value = value;
        }
      });
    }

    function updateTabBarItemProperty(key, value) {
      if (selectedTabBarItem !== null && tabBarConfig.list[selectedTabBarItem]) {
        tabBarConfig.list[selectedTabBarItem][key] = value;
        renderTabBarList();
        renderTabBar();
        saveConfig();
      }
    }

    function showImagePicker(inputId, inputElement) {
      console.log('[图片选择器] 显示图片列表, inputId:', inputId);
      console.log('[图片选择器] window.userImages:', window.userImages);

      const imageListDiv = document.getElementById(inputId + '-imageList');

      if (!imageListDiv) {
        console.error('[图片选择器] 找不到图片列表容器:', inputId + '-imageList');
        return;
      }

      if (!window.userImages || window.userImages.length === 0) {
        console.warn('[图片选择器] 没有用户图片数据');
        imageListDiv.innerHTML = '<div class="no-images">暂无图片数据</div>';
        imageListDiv.style.display = 'block';
        return;
      }

      console.log('[图片选择器] 开始渲染', window.userImages.length, '张图片');

      const currentTab = tabBarConfig.list[selectedTabBarItem] || null;

      imageListDiv.innerHTML = window.userImages.map(img => {
        const isSelected =
          currentTab &&
          (
            (inputId === 'selectedIcon' && img.rowid === currentTab.selectedIconRowid) ||
            (inputId === 'unselectedIcon' && img.rowid === currentTab.unselectedIconRowid)
          );
        const selectedClass = isSelected ? ' selected' : '';

        return `
        <div class="image-item${selectedClass}" onclick="selectImage('${inputId}', '${img.rowid}', '${img.mingcheng}', '${img.url}')" data-rowid="${img.rowid}">
          <img src="${img.url}" alt="${img.mingcheng}" />
          <div class="image-info">
            <div class="image-name">${img.mingcheng}</div>
            <div class="image-category">${img.leibie || ''}</div>
          </div>
        </div>
        `;
      }).join('');

      console.log('[图片选择器] 渲染完成，显示图片列表');
      imageListDiv.style.display = 'block';
    }

    function filterImageList(keyword, inputId) {
      console.log('[图片选择器] 过滤图片, keyword:', keyword);

      const imageListDiv = document.getElementById(inputId + '-imageList');

      if (!keyword) {
        imageListDiv.querySelectorAll('.image-item').forEach(item => {
          item.style.display = 'flex';
        });
        return;
      }

      const lowerKeyword = keyword.toLowerCase();
      imageListDiv.querySelectorAll('.image-item').forEach(item => {
        const name = item.querySelector('.image-name').textContent.toLowerCase();
        const category = item.querySelector('.image-category').textContent.toLowerCase();

        if (name.includes(lowerKeyword) || category.includes(lowerKeyword)) {
          item.style.display = 'flex';
        } else {
          item.style.display = 'none';
        }
      });
    }

    function selectImage(inputId, rowid, name, url) {
      console.log('[图片选择器] 选择图片, inputId:', inputId, 'rowid:', rowid, 'name:', name);

      const inputElement = document.querySelector(`input[onfocus*="showImagePicker('${inputId}'"]`);

      if (inputElement) {
        inputElement.value = name;
        updateTabBarItemProperty(inputId, name);

        const tab = tabBarConfig.list[selectedTabBarItem];
        tab[inputId + 'Rowid'] = rowid;

        console.log('[图片选择器] 更新tab配置:', JSON.stringify(tab, null, 2));

        renderTabBarList();
        renderTabBar();
        saveConfig();

        const imageListDiv = document.getElementById(inputId + '-imageList');
        imageListDiv.style.display = 'none';
      }
    }

    document.addEventListener('click', function (event) {
      if (!event.target.closest('.property-group')) {
        document.querySelectorAll('.image-picker').forEach(picker => {
          picker.style.display = 'none';
        });
      }
    });

    function copySelected() {
      if (sidebarView === 'pages' && currentPage) {
        copyPage(currentPage.pageId);
      } else if (sidebarView === 'tabbar' && selectedTabBarItem !== null) {
        copyTabBarItem(selectedTabBarItem);
      }
      updateActionButtonsVisibility();
    }

    function deleteSelected() {
      if (sidebarView === 'pages' && currentPage) {
        deletePage(currentPage.pageId);
      } else if (sidebarView === 'tabbar' && selectedTabBarItem !== null) {
        deleteTabBarItem(selectedTabBarItem);
      }
      updateActionButtonsVisibility();
    }

    function copyTabBarItem(index) {
      const tab = tabBarConfig.list[index];
      const newTab = {
        name: tab.name + ' 副本',
        selectedIcon: tab.selectedIcon,
        unselectedIcon: tab.unselectedIcon,
        pageId: tab.pageId
      };
      tabBarConfig.list.splice(index + 1, 0, newTab);
      renderTabBarList();
      renderTabBar();
      saveConfig();
    }

    function selectView(view, event) {
      console.log('selectView called:', view);
      if (event) {
        event.stopPropagation();
        console.log('Event stopped');
      }

      const dropdown = document.getElementById('sidebarDropdown');
      if (dropdown) {
        dropdown.classList.remove('open');
        console.log('Dropdown closed immediately');
      }

      sidebarView = view;
      updateSidebarView();
      updateActionButtonsVisibility();
    }

    function updateSidebarView() {
      console.log('updateSidebarView called, sidebarView:', sidebarView);
      const title = document.getElementById('sidebarTitle');
      const pageTree = document.getElementById('pageTree');
      const addButton = document.querySelector('.btn-add');

      if (sidebarView === 'pages') {
        console.log('Switching to pages view');
        title.textContent = '页面';
        pageTree.style.display = 'block';
        pageTree.style.visibility = 'visible';
        pageTree.style.pointerEvents = 'auto';
        pageTree.innerHTML = '';
        if (tabBarConfig.list.length > 0) {
          if (selectedTabBarItem === null) {
            selectedTabBarItem = 0;
          }
          const selectedTab = tabBarConfig.list[selectedTabBarItem];
          if (selectedTab && selectedTab.pageId) {
            const targetPage = pages.find(p => p.pageId === selectedTab.pageId);
            if (targetPage) {
              currentPage = targetPage;
            }
          }
        }
        renderPageTree();
        renderComponentLibrary();
        addButton.style.display = 'block';
        addButton.onclick = addPage;
        renderProperties();
      } else if (sidebarView === 'tabbar') {
        console.log('Switching to tabbar view');
        title.textContent = '底部导航栏';
        pageTree.style.display = 'block';
        pageTree.style.visibility = 'visible';
        pageTree.style.pointerEvents = 'auto';
        pageTree.innerHTML = '';
        renderTabBarList();
        addButton.style.display = 'block';
        addButton.onclick = addTabBarItem;
        currentPage = null;
        selectedComponent = null;

        if (tabBarConfig.list.length > 0 && selectedTabBarItem === null) {
          selectedTabBarItem = 0;
          renderTabBarList();
          renderTabBarProperties();
        } else {
          renderTabBarProperties();
        }
      } else if (sidebarView === 'global') {
        console.log('Switching to global view');
        title.textContent = '全局设置';
        pageTree.style.display = 'block';
        pageTree.style.visibility = 'hidden';
        pageTree.style.pointerEvents = 'none';
        addButton.style.display = 'none';
        if (!currentPage && pages.length > 0) {
          currentPage = pages[0];
        }
        renderGlobalProperties();
        renderTabBar();
      }

      console.log('updateSidebarView completed');
    }

    document.addEventListener('click', function (event) {
      const dropdown = document.getElementById('sidebarDropdown');
      if (dropdown && !dropdown.contains(event.target)) {
        dropdown.classList.remove('open');
      }
      const pageSelect = document.getElementById('tabBarPageSelect');
      if (pageSelect && !pageSelect.contains(event.target)) {
        pageSelect.classList.remove('open');
      }
    });

    function generateUUID() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
        var r = Math.random() * 16 | 0,
          v = c == 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    function renderPageTree() {
      const pageTree = document.getElementById('pageTree');
      pageTree.innerHTML = '';

      pages.forEach((page, index) => {
        const hasChildren = page.components && page.components.length > 0;
        const isExpanded = page.expanded !== false;

        const pageItem = document.createElement('div');
        pageItem.className = 'page-item' + (currentPage && currentPage.pageId === page.pageId ? ' active' : '');
        pageItem.innerHTML = `
          <div class="page-item-content">
            <span class="toggle-arrow ${isExpanded ? 'expanded' : ''} ${hasChildren ? '' : 'hidden'}" onclick="event.stopPropagation(); togglePageExpand('${page.pageId}')">▶</span>
            <span class="page-name">${page.pageName}</span>
          </div>
        `;
        pageItem.onclick = () => selectPage(page);
        pageItem.ondblclick = (e) => editPageName(page.pageId, e);
        pageTree.appendChild(pageItem);

        if (hasChildren && isExpanded) {
          const childrenContainer = document.createElement('div');
          childrenContainer.className = 'page-children expanded';
          childrenContainer.id = `page-children-${page.pageId}`;

          page.components.forEach((component, compIndex) => {
            const childItem = document.createElement('div');
            childItem.className = 'page-child-item' + (selectedComponent && selectedComponent.componentId === component.componentId ? ' selected' : '');
            childItem.draggable = true;
            childItem.dataset.componentId = component.componentId;
            childItem.dataset.pageId = page.pageId;
            childItem.dataset.index = compIndex;
            childItem.innerHTML = `
              <span class="drag-handle">⋮⋮</span>
              <span class="child-icon">${getComponentIcon(component.componentName)}</span>
              <span>${component.componentName}</span>
            `;

            childItem.onclick = (e) => {
              if (!e.target.classList.contains('drag-handle')) {
                selectComponent(component);
              }
            };

            childItem.ondragstart = (e) => handleChildDragStart(e, page.pageId, compIndex);
            childItem.ondragover = (e) => handleChildDragOver(e);
            childItem.ondragleave = (e) => handleChildDragLeave(e);
            childItem.ondrop = (e) => handleChildDrop(e, page.pageId, compIndex);
            childItem.ondragend = (e) => handleChildDragEnd(e);

            childrenContainer.appendChild(childItem);
          });

          pageTree.appendChild(childrenContainer);
        }
      });
    }

    function getComponentIcon(componentName) {
      const iconMap = {
        '轮播图': '🎠',
        '功能列表': '📋',
        '图片': '🖼️',
        '文本': '📝',
        '商品网格': '🛍️',
        '商品列表': '📦',
        '公告': '📢',
        '标签页面': '📑',
        '内容列表': '📄',
        '我的订单': '📋',
        '会员权益消耗明细': '🎁',
        '登录用户协议': '📜',
        '新手引导': '✨',
        '设置': '⚙️'
      };
      return iconMap[componentName] || '📄';
    }

    function togglePageExpand(pageId) {
      const page = pages.find(p => p.pageId === pageId);
      if (page) {
        page.expanded = page.expanded === false ? true : false;
        renderPageTree();
      }
    }

    let draggedComponent = null;
    let draggedPageIndex = null;

    function handleChildDragStart(e, pageId, index) {
      draggedComponent = e.target.dataset.componentId;
      draggedPageIndex = index;
      e.target.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    }

    function handleChildDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const target = e.target.closest('.page-child-item');
      if (target && target.dataset.componentId !== draggedComponent) {
        target.classList.add('drag-over');
      }
    }

    function handleChildDragLeave(e) {
      const target = e.target.closest('.page-child-item');
      if (target) {
        target.classList.remove('drag-over');
      }
    }

    function handleChildDrop(e, pageId, targetIndex) {
      e.preventDefault();
      e.stopPropagation();

      const target = e.target.closest('.page-child-item');
      if (target) {
        target.classList.remove('drag-over');
      }

      if (draggedComponent === null || draggedPageIndex === null) {
        return;
      }

      const page = pages.find(p => p.pageId === pageId);
      if (!page || draggedPageIndex === targetIndex) {
        return;
      }

      const componentToMove = page.components[draggedPageIndex];
      page.components.splice(draggedPageIndex, 1);
      page.components.splice(targetIndex, 0, componentToMove);

      draggedComponent = null;
      draggedPageIndex = null;

      renderPageTree();
      renderPreview();
    }

    function handleChildDragEnd(e) {
      e.target.classList.remove('dragging');
      const dragOverItems = document.querySelectorAll('.page-child-item.drag-over');
      dragOverItems.forEach(item => item.classList.remove('drag-over'));
      draggedComponent = null;
      draggedPageIndex = null;
    }

    function selectPage(page) {
      currentPage = page;
      selectedComponent = null; // 只选中页面，不选中组件，支持页面级参数设计
      renderPageTree();
      renderComponentLibrary();
      renderPreview();
      renderProperties();
      renderTabBar();
      updateActionButtonsVisibility();
    }

    function addPage() {
      const newPage = {
        pageId: generateUUID(),
        pageName: '新页面 ' + (pages.length + 1),
        pageType: 'home',
        components: []
      };
      pages.push(newPage);
      selectPage(newPage);
      renderPageTree();
    }

    function copyPage(pageId) {
      const page = pages.find(p => p.pageId === pageId);
      if (page) {
        const newPage = {
          pageId: generateUUID(),
          pageName: page.pageName + ' (副本)',
          pageType: page.pageType || 'home',
          components: JSON.parse(JSON.stringify(page.components))
        };
        pages.push(newPage);
        renderPageTree();
      }
    }

    function deletePage(pageId) {
      if (confirm('确定要删除这个页面吗？')) {
        pages = pages.filter(p => p.pageId !== pageId);
        if (currentPage && currentPage.pageId === pageId) {
          currentPage = pages.length > 0 ? pages[0] : null;
        }
        renderPageTree();
        if (currentPage) {
          renderPreview();
        } else {
          document.getElementById('pageCanvas').innerHTML = '';
        }
      }
    }

    function renderPreview() {
      const pageCanvas = document.getElementById('pageCanvas');
      pageCanvas.innerHTML = '';

      const navbarTitle = document.getElementById('navbarTitle');
      const navbarBack = document.getElementById('navbarBack');

      if (currentPage) {
        navbarTitle.textContent = currentPage.pageName;
        const isHomePage = tabBarConfig.list.some(tab => tab.pageId === currentPage.pageId);
        navbarBack.style.visibility = isHomePage ? 'hidden' : 'visible';
      } else {
        navbarTitle.textContent = '页面标题';
        navbarBack.style.visibility = 'hidden';
      }

      const isMyPage = currentPage && (currentPage.pageType === 'my' || currentPage.pageName === '我的');

      // 「我的」页面顶部固定用户信息栏：必须显示，不可拖拽、不可删除
      if (isMyPage) {
        const userBar = document.createElement('div');
        userBar.className = 'my-page-user-bar';
        const barBg = currentPage.userInfoBarBackground ?? '{主题色}';
        const barBgResolved = resolveThemeColor(barBg) || '#0557e1';
        userBar.style.background = barBgResolved;
        const avatarUrl = globalConfig.myPageUserAvatar || '';
        const avatarHtml = avatarUrl
          ? `<img src="${avatarUrl}" alt="头像" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`
          : '👤';
        userBar.innerHTML = `
          <div class="user-avatar">${avatarHtml}</div>
          <div class="user-info">
            <div class="user-nickname">${(globalConfig.myPageUserNickname || '用户昵称').replace(/</g, '&lt;')}</div>
            <div class="user-id">ID: ${(globalConfig.myPageUserId || '--').replace(/</g, '&lt;')}</div>
          </div>
        `;
        pageCanvas.appendChild(userBar);
      }

      if (!currentPage || currentPage.components.length === 0) {
        const placeholder = document.createElement('div');
        placeholder.className = 'component-placeholder';
        placeholder.textContent = '拖拽组件到此处开始设计页面';
        pageCanvas.appendChild(placeholder);
        renderTabBar();
        return;
      }

      currentPage.components.forEach((component, index) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'component-wrapper' + (selectedComponent && selectedComponent.componentId === component.componentId ? ' selected' : '');
        wrapper.dataset.componentId = component.componentId;
        wrapper.onclick = () => selectComponent(component);
        wrapper.innerHTML = renderComponentPreview(component);
        pageCanvas.appendChild(wrapper);
      });

      renderTabBar();
    }

    function renderComponentPreview(component) {
      switch (component.componentName) {
        case '轮播图':
          return `
            <div style="background: #f0f0f0; height: ${component.properties.height || 200}px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #999;">
              🖼️ 轮播图 (${component.componentItems.length}张)
            </div>
          `;
        case '功能列表':
          return `
            <div style="background: #fff; padding: 10px; border-radius: 8px;">
              <div style="display: grid; grid-template-columns: repeat(${component.properties.columns || 3}, 1fr); gap: 10px;">
                ${component.componentItems.map(item => `
                  <div style="text-align: center; padding: 10px;">
                    <div style="font-size: 24px;">📱</div>
                    <div style="font-size: 12px; color: #666;">${item}</div>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        case '图片':
          return `
            <div style="background: #f0f0f0; height: ${component.properties.height || 'auto'}; border-radius: ${component.properties.borderRadius || 0}px; display: flex; align-items: center; justify-content: center; color: #999;">
              🖼️ 图片
            </div>
          `;
        case '文本':
          return `
            <div style="font-size: ${component.properties.fontSize || 16}px; color: ${component.properties.color || '#333'}; text-align: ${component.properties.textAlign || 'left'}; padding: 10px;">
              ${component.componentItems[0] || '文本内容'}
            </div>
          `;
        case '商品网格':
          return `
            <div style="background: #fff; padding: 10px; border-radius: 8px;">
              <div style="display: grid; grid-template-columns: repeat(${component.properties.columns || 2}, 1fr); gap: 10px;">
                ${[1, 2, 3, 4].map(i => `
                  <div style="background: #f9f9f9; border-radius: 8px; overflow: hidden;">
                    <div style="height: 80px; background: #e0e0e0; display: flex; align-items: center; justify-content: center; color: #999;">商品${i}</div>
                    <div style="padding: 8px;">
                      <div style="font-size: 12px; color: #333; margin-bottom: 4px;">商品名称${i}</div>
                      ${component.properties.showPrice ? '<div style="font-size: 14px; color: #ff4400; font-weight: bold;">¥99.00</div>' : ''}
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        case '公告':
          return `
            <div style="background: ${component.properties.backgroundColor || '#fff7e6'}; color: ${component.properties.textColor || '#ff6b00'}; padding: 10px; border-radius: 8px; display: flex; align-items: center;">
              <span style="margin-right: 8px;">${component.properties.icon || '📢'}</span>
              <span>${component.componentItems[0] || '公告内容'}</span>
            </div>
          `;
        case '标签页面':
          return `
            <div style="background: #fff; padding: 10px; border-radius: 8px;">
              <div style="display: flex; gap: 10px; border-bottom: 1px solid #e0e0e0;">
                ${component.componentItems.map((item, i) => `
                  <div style="padding: 8px 16px; cursor: pointer; ${i === 0 ? 'color: #667eea; border-bottom: 2px solid #667eea;' : ''}">${item}</div>
                `).join('')}
              </div>
            </div>
          `;
        case '内容列表':
          const contentTabs = component.properties.enableTabs ? component.properties.tabs : [];
          const contentThemeColor = resolveThemeColor(component.properties.tabThemeColor) || '#667eea';
          const allTabExists = contentTabs.find(t => t.label === '全部');
          const displayTabs = contentTabs.length > 0 ? [{ label: '全部', field: '', value: '' }, ...contentTabs] : [];
          return `
            <div style="background: #fff; padding: 10px; border-radius: 8px;">
              ${component.properties.enableTabs && displayTabs.length > 0 ? `
                <div style="display: flex; gap: 12px; border-bottom: 1px solid #f0f0f0; padding-bottom: 10px; margin-bottom: 10px; overflow-x: auto;">
                  ${displayTabs.map((tab, idx) => `
                    <span style="padding: 6px 12px; font-size: 14px; color: ${idx === 0 ? contentThemeColor : '#666'}; border-bottom: 2px solid ${idx === 0 ? contentThemeColor : 'transparent'}; white-space: nowrap;">${tab.label}</span>
                  `).join('')}
                </div>
              ` : ''}
              ${component.componentItems.length > 0 ? component.componentItems.map(item => `
                <div style="padding: 12px; border-bottom: 1px solid #f0f0f0; display: flex; gap: 10px;">
                  <div style="width: 60px; height: 60px; background: #e0e0e0; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #999;">图</div>
                  <div style="flex: 1;">
                    <div style="font-size: 14px; color: #333; margin-bottom: 4px;">${item.title || '标题'}</div>
                    <div style="font-size: 12px; color: #666;">${item.desc || '描述'}</div>
                  </div>
                </div>
              `).join('') : '<div style="padding: 20px; text-align: center; color: #999;">暂无内容</div>'}
            </div>
          `;
        case '我的订单':
          return `<div style="background: #fff; padding: 16px; border-radius: 8px; border: 1px solid #eee;"><div style="font-size: 14px; color: #333;">📋 ${component.properties.title || '我的订单'}</div><div style="font-size: 12px; color: #999; margin-top: 8px;">订单列表占位</div></div>`;
        case '会员权益消耗明细':
          return `<div style="background: #fff; padding: 16px; border-radius: 8px; border: 1px solid #eee;"><div style="font-size: 14px; color: #333;">🎁 ${component.properties.title || '会员权益消耗明细'}</div></div>`;
        case '登录用户协议':
          return `<div style="background: #fff; padding: 16px; border-radius: 8px; border: 1px solid #eee;"><div style="font-size: 14px; color: #333;">📜 ${component.properties.title || '登录用户协议'}</div></div>`;
        case '新手引导':
          return `<div style="background: #fff; padding: 16px; border-radius: 8px; border: 1px solid #eee;"><div style="font-size: 14px; color: #333;">✨ ${component.properties.title || '新手引导'}</div></div>`;
        case '设置':
          return `<div style="background: #fff; padding: 16px; border-radius: 8px; border: 1px solid #eee;"><div style="font-size: 14px; color: #333;">⚙️ ${component.properties.title || '设置'}</div><div style="font-size: 12px; color: #999; margin-top: 8px;">设置项占位</div></div>`;
        default:
          return `<div style="padding: 20px; text-align: center; color: #999;">${component.componentName}</div>`;
      }
    }

    function renderTabBar() {
      const tabBar = document.getElementById('tabBar');
      tabBar.className = 'tab-bar ' + tabBarConfig.style;
      tabBar.style.backgroundColor = resolveThemeColor(tabBarConfig.backgroundColor);
      const activeColor = resolveThemeColor(tabBarConfig.selectedColor || '#667eea');
      const inactiveColor = resolveThemeColor(tabBarConfig.unselectedColor || '#999999');
      tabBar.innerHTML = tabBarConfig.list.map((tab, index) => {
        const selectedIconUrl = getImageUrlByRowid(tab.selectedIconRowid);
        const unselectedIconUrl = getImageUrlByRowid(tab.unselectedIconRowid);
        const isActive = currentPage && currentPage.pageId === tab.pageId;
        const iconUrl = isActive ? selectedIconUrl : unselectedIconUrl;
        const defaultIcon = tab.name === '首页' ? '🏠' : tab.name === '分类' ? '📂' : '👤';
        const textColor = isActive ? activeColor : inactiveColor;
        const iconStyle = iconUrl ? `style="color: ${textColor}; -webkit-mask-image: url('${iconUrl}'); mask-image: url('${iconUrl}');"` : '';

        return `
        <div class="tab-item ${isActive ? 'active' : ''}" style="color: ${textColor};" onclick="selectTabBarItemFromPreview(${index})">
          <div class="tab-icon">${iconUrl ? `<span class="tab-icon-img" ${iconStyle}></span>` : defaultIcon}</div>
          <div>${tab.name}</div>
        </div>
        `;
      }).join('');
    }

    function getImageUrlByRowid(rowid) {
      if (!rowid || !window.userImages || window.userImages.length === 0) {
        return null;
      }

      const image = window.userImages.find(img => img.rowid === rowid);
      return image ? image.url : null;
    }

    function selectTabBarItemFromPreview(index) {
      console.log('[底部导航] 点击预览区底部导航项, index:', index);
      selectedTabBarItem = index;
      const tab = tabBarConfig.list[index];
      if (tab && tab.pageId) {
        const page = pages.find(p => p.pageId === tab.pageId);
        if (page) {
          currentPage = page;
          selectedComponent = null;
          console.log('[底部导航] 已切换为页面:', page.pageName);
        }
      }
      // 保持或切回「页面」视图，并同步页面树、组件库、预览，避免预览与左侧选中页不一致
      if (sidebarView !== 'pages') {
        selectView('pages');
      } else {
        renderPageTree();
        renderComponentLibrary();
        renderPreview();
        renderProperties();
      }
      renderTabBar();
      updateActionButtonsVisibility();
    }

    function handlePageCanvasClick() {
      if (sidebarView === 'tabbar' && selectedTabBarItem !== null) {
        const tab = tabBarConfig.list[selectedTabBarItem];
        if (tab && tab.pageId) {
          const page = pages.find(p => p.pageId === tab.pageId);
          if (page) {
            selectView('pages');
            selectPage(page);
          }
        }
      }
    }

    function renderTabBarList() {
      console.log('[底部导航] renderTabBarList 被调用');
      console.log('[底部导航] tabBarConfig.list:', tabBarConfig.list);
      console.log('[底部导航] selectedTabBarItem:', selectedTabBarItem);
      const tabBarList = document.getElementById('pageTree');
      tabBarList.innerHTML = tabBarConfig.list.map((tab, index) => {
        const isActive = selectedTabBarItem === index;
        console.log(`[底部导航] 渲染导航项 ${index}: ${tab.name}, active: ${isActive}`);
        return `
        <div class="page-item ${isActive ? 'active' : ''}" onclick="selectTabBarItem(${index})" ondblclick="editTabBarItemName(${index}, event)">
          <div class="page-item-content">
            <span class="page-name">${tab.name}</span>
          </div>
        </div>
        `;
      }).join('');
      console.log('[底部导航] renderTabBarList 完成');
    }

    function editTabBarItemName(index, event) {
      event.stopPropagation();
      const tab = tabBarConfig.list[index];
      const pageItem = event.currentTarget;
      const nameSpan = pageItem.querySelector('.page-name');

      const input = document.createElement('input');
      input.type = 'text';
      input.value = tab.name;
      input.className = 'page-name-input';
      input.style.cssText = 'font-size: 14px; font-weight: 500; color: var(--text-main); border: 1px solid var(--admin-primary-color); border-radius: 4px; padding: 4px 8px; width: 100%; box-sizing: border-box;';

      const saveName = () => {
        const newName = input.value.trim();
        if (newName && newName !== tab.name) {
          tab.name = newName;
          renderTabBarList();
          renderTabBar();
          saveConfig();
        } else {
          renderTabBarList();
        }
      };

      input.addEventListener('blur', saveName);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          saveName();
        } else if (e.key === 'Escape') {
          renderTabBarList();
        }
      });

      nameSpan.replaceWith(input);
      input.focus();
      input.select();
    }

    function addTabBarItem() {
      console.log('addTabBarItem called');
      console.log('tabBarConfig.list:', tabBarConfig.list);

      if (tabBarConfig.list.length >= 6) {
        alert('最多只能创建6个导航项！');
        return;
      }

      const newTab = {
        name: `导航项 ${tabBarConfig.list.length + 1}`,
        selectedIcon: 'home-active.png',
        unselectedIcon: 'home.png',
        pageId: null
      };

      console.log('newTab:', newTab);
      tabBarConfig.list.push(newTab);
      console.log('tabBarConfig.list after push:', tabBarConfig.list);

      selectedTabBarItem = tabBarConfig.list.length - 1;
      renderTabBarList();
      renderTabBar();
      renderTabBarProperties();
      saveConfig();
    }

    function deleteTabBarItem(index) {
      if (!confirm('确定要删除这个导航项吗？')) return;

      tabBarConfig.list.splice(index, 1);
      selectedTabBarItem = null;
      renderTabBarList();
      renderTabBar();
      renderTabBarProperties();
      saveConfig();
    }

    function updateActionButtonsVisibility() {
      const copyButton = document.getElementById('copyButton');
      const deleteButton = document.getElementById('deleteButton');
      if (!copyButton || !deleteButton) return;

      if (sidebarView === 'pages') {
        if (!currentPage) {
          copyButton.style.display = 'none';
          deleteButton.style.display = 'none';
          return;
        }

        if (currentPage.pageId === 'default-page-1') {
          copyButton.style.display = 'inline-block';
          deleteButton.style.display = 'none';
          return;
        }

        if (currentPage.pageId === 'default-page-2') {
          copyButton.style.display = 'none';
          deleteButton.style.display = 'none';
          return;
        }

        copyButton.style.display = 'inline-block';
        deleteButton.style.display = 'inline-block';
        return;
      }

      if (sidebarView === 'tabbar') {
        if (selectedTabBarItem === null || !tabBarConfig.list[selectedTabBarItem]) {
          copyButton.style.display = 'none';
          deleteButton.style.display = 'none';
          return;
        }

        const tab = tabBarConfig.list[selectedTabBarItem];

        if (tab.pageId === 'default-page-1' || tab.name === '首页') {
          copyButton.style.display = 'inline-block';
          deleteButton.style.display = 'none';
          return;
        }

        if (tab.pageId === 'default-page-2' || tab.name === '我的') {
          copyButton.style.display = 'none';
          deleteButton.style.display = 'none';
          return;
        }

        copyButton.style.display = 'inline-block';
        deleteButton.style.display = 'inline-block';
      }
    }

    function editPageName(pageId, event) {
      event.stopPropagation();
      const page = pages.find(p => p.pageId === pageId);
      if (!page) return;

      const pageItem = event.currentTarget;
      const nameSpan = pageItem.querySelector('.page-name');

      const input = document.createElement('input');
      input.type = 'text';
      input.value = page.pageName;
      input.className = 'page-name-input';
      input.style.cssText = 'font-size: 14px; font-weight: 500; color: var(--text-main); border: 1px solid var(--admin-primary-color); border-radius: 4px; padding: 4px 8px; width: 100%; box-sizing: border-box;';

      const saveName = () => {
        const newName = input.value.trim();
        if (newName && newName !== page.pageName) {
          page.pageName = newName;
          renderPageTree();
          renderPreview();
          saveConfig();
        } else {
          renderPageTree();
        }
      };

      input.addEventListener('blur', saveName);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          saveName();
        } else if (e.key === 'Escape') {
          renderPageTree();
        }
      });

      nameSpan.replaceWith(input);
      input.focus();
      input.select();
    }

    function selectComponent(component) {
      selectedComponent = component;
      renderPageTree();
      renderPreview();
      renderProperties();
    }

    function renderProperties() {
      const propertiesContent = document.getElementById('propertiesContent');

      if (currentPage && !selectedComponent) {
        const isMyPage = currentPage.pageType === 'my' || currentPage.pageName === '我的';
        let pagePropsHtml = `
          <div class="property-group">
            <label>页面名称</label>
            <input type="text" value="${(currentPage.pageName || '').replace(/"/g, '&quot;')}" onchange="updatePageProperty('pageName', this.value)">
          </div>
        `;
        if (isMyPage) {
          const barBg = currentPage.userInfoBarBackground ?? '{主题色}';
          const barBgResolved = resolveThemeColor(barBg) || '#0557e1';
          pagePropsHtml += `
          <div class="property-group">
            <label>用户信息栏背景色</label>
            <div class="color-picker-wrapper">
              <div class="color-picker-container">
                <div class="color-picker-preview" data-color-key="page-userBarBg" style="background-color: ${barBgResolved}; width: 100%; height: 100%;"></div>
                <input type="color" id="colorPicker-userBarBg" data-color-key="page-userBarBg" value="${barBgResolved}" oninput="updateMyPageUserBarBackground(this.value)" onchange="updateMyPageUserBarBackground(this.value)" class="color-picker-input-overlay">
              </div>
              <div class="color-input-row">
                <input type="text" data-color-key="page-userBarBg" value="${(barBg || '').replace(/"/g, '&quot;')}" oninput="updateMyPageUserBarBackground(this.value)" onchange="updateMyPageUserBarBackground(this.value)" class="color-text-input" placeholder="#0557e1 或 {主题色}">
                <button class="theme-token-btn" type="button" onclick="setThemeTokenForMyPageUserBar()">主题色</button>
              </div>
            </div>
          </div>
        `;
        }
        propertiesContent.innerHTML = pagePropsHtml;
        return;
      }

      if (!selectedComponent) {
        propertiesContent.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🎯</div>
            <div class="empty-text">请选择一个组件进行编辑</div>
          </div>
        `;
        return;
      }

      let html = `
        <div class="property-group">
          <label>组件名称</label>
          <input type="text" value="${selectedComponent.componentName}" readonly>
        </div>
      `;

      Object.keys(selectedComponent.properties || {}).forEach(key => {
        const value = selectedComponent.properties[key];
        const label = getPropertyLabel(key);

        if (selectedComponent.componentName === '内容列表' && key === 'enableTabs') {
          html += `
            <div class="property-group">
              <label>${label}</label>
              <select onchange="updateContentListTabs(this.value)">
                <option value="false" ${!value ? 'selected' : ''}>否</option>
                <option value="true" ${value ? 'selected' : ''}>是</option>
              </select>
            </div>
          `;
        } else if (selectedComponent.componentName === '内容列表' && key === 'tabThemeColor') {
          const themeColor = resolveThemeColor(selectedComponent.properties.tabThemeColor) || '#667eea';
          html += `
            <div class="property-group">
              <label>${label}</label>
              <div class="color-picker-wrapper">
                <div class="color-picker-container">
                  <div class="color-picker-preview" data-color-key="tabThemeColor" style="background-color: ${themeColor}; width: 100%; height: 100%;"></div>
                  <input type="color" id="colorPicker-tabThemeColor" data-color-key="tabThemeColor" value="${themeColor}" oninput="updateContentListTabThemeColor(this.value)" onchange="updateContentListTabThemeColor(this.value)" class="color-picker-input-overlay">
                </div>
                <div class="color-input-row">
                  <input type="text" data-color-key="tabThemeColor" value="${selectedComponent.properties.tabThemeColor || ''}" oninput="updateContentListTabThemeColor(this.value)" onchange="updateContentListTabThemeColor(this.value)" onkeypress="handleColorInputKeypress(event, 'tabThemeColor', this.value)" class="color-text-input" placeholder="#000000">
                  <button class="theme-token-btn" type="button" onclick="setThemeTokenForContentListTab('tabThemeColor')">主题色</button>
                </div>
              </div>
            </div>
          `;
        } else if (selectedComponent.componentName === '内容列表' && key === 'tabs') {
          const tabs = selectedComponent.properties.tabs || [];
          html += `
            <div class="property-group">
              <label>${label}</label>
              <div id="tabsConfigContainer" style="margin-top: 8px;">
                ${tabs.map((tab, index) => `
                  <div class="tab-config-item" style="padding: 12px; border: 1px solid #e8e8e8; border-radius: 6px; margin-bottom: 10px; background: #fafafa;">
                    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
                      <span style="font-size: 12px; color: #999; font-weight: 500;">标签 ${index + 1}</span>

    function getDataSourceOptionsHtml(component) {

        return commonOptions.map(opt => {
          const selected = currentKey === opt.value ? 'selected' : '';
          return `<option value="${opt.value}" ${selected}>${opt.label}</option>`;
        }).join('');

      const customOptions = [

      return customOptions.map(opt => {

        return `<option value="${opt.value}" ${selected}>${opt.label}</option>`;
      }).join('');

    function loadConfig() {
      const config = localStorage.getItem('decorationConfig');
      if (config) {
        try {
          const data = JSON.parse(config);
          globalConfig = data.globalConfig || globalConfig;
          tabBarConfig = data.tabBarConfig || tabBarConfig;
          pages = (data.pages || []).map(p => ({
            ...p,
            pageType: p.pageType || (p.pageName === '我的' ? 'my' : 'home')
          }));

          if (pages.length === 0) {
            pages = [
              { pageId: 'default-page-1', pageName: '首页', pageType: 'home', components: [] },
              { pageId: 'default-page-2', pageName: '我的', pageType: 'my', components: [] }
            ];

            if (!tabBarConfig || !Array.isArray(tabBarConfig.list)) {
              tabBarConfig = {
                style: 'classic',
                backgroundColor: '#ffffff',
                selectedColor: '#667eea',
                unselectedColor: '#999999',
                list: []
              };

                  unselectedIcon: '',
                  unselectedIconRowid: '5f96392a-bd0e-4d78-a14c-803493ddf484',

                },

                  selectedIconRowid: '67467570-f4ec-4aad-a374-dbbeecd43d22',
                  unselectedIcon: '',
                  unselectedIconRowid: '736e427c-e162-4e98-b5dd-a877c70b6c3d',
                  pageId: 'default-page-2'
                }
              ];
            } else {

                tabBarConfig.list[0].pageId = 'default-page-1';
                tabBarConfig.list[0].name = tabBarConfig.list[0].name || '首页';

    async function publishCode() {
      // 发布前确保每个页面有 pageType，便于服务端生成「我的」页用户信息栏
      const pagesToSend = pages.map(p => ({
        ...p,
        pageType: p.pageType || (p.pageName === '我的' ? 'my' : 'home')
      }));
      const config = {
        merchantId: window.merchantId || localStorage.getItem('merchantId') || '',
        globalConfig: globalConfig,
        tabBarConfig: tabBarConfig,
        pages: pagesToSend,
        userImages: window.userImages || []
      };

      console.log('[decoration.html] 发布代码:', config);
      console.log('[decoration.html] 我的页面 pageType:', pagesToSend.filter(p => p.pageName === '我的').map(p => p.pageType));
      console.log('[decoration.html] 当前商家ID:', config.merchantId);
      console.log('[decoration.html] 用户图片数量:', config.userImages.length);

      pages.forEach((page, pageIdx) => {
        page.components.forEach((comp, compIdx) => {
          if (comp.componentName === '内容列表') {
            console.log(`[decoration.html] 页面${pageIdx} 内容列表组件${compIdx}:`, JSON.stringify(comp.properties, null, 2));
          }
        });
      });

      try {
        const response = await fetch('/api/generate-miniprogram', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(config)
        });

        console.log('[decoration.html] 响应状态:', response.status, response.statusText);

        if (!response.ok) {
          const errorText = await response.text();
          console.error('[decoration.html] 错误响应:', errorText);
          alert(`请求失败 (${response.status}): ${errorText}`);
          return;
        }

        const result = await response.json();
        console.log('[decoration.html] 响应结果:', result);

        if (result.success) {
          alert('代码生成成功！正在下载...');
          window.location.href = result.downloadUrl;
        } else {
          alert('生成失败: ' + result.message);
        }
      } catch (error) {
        console.error('[decoration.html] 请求异常:', error);
        alert('请求失败: ' + error.message);
      }
    }

      e.preventDefault();
      const componentType = e.dataTransfer.getData('componentType');

        const component = {
          componentName: getComponentName(componentType),
          componentId: generateUUID(),

          properties: getDefaultProperties(componentType)

    async function loadUserImages() {
      console.log('[图片导入] 开始加载用户上传的图片');

      const api = new MingDaoYunArrayAPI();

      const filters = [
        {
          'controlId': 'mid',
          'dataType': 2,
          'spliceType': 2,
          'filterType': 2,
          'value': window.merchantId
        },
        {
          'controlId': 'shangjia',
          'dataType': 2,
          'spliceType': 2,
          'filterType': 24,
          'value': 'e26e5792-65c6-483e-8dde-fb7c0a667f84'
        }
      ];

      const requestParams = {
        worksheetId: 'scgl',
        filters: filters,
        pageSize: 50,
        pageIndex: 1
      };

      console.log('[图片导入] 请求参数:', JSON.stringify(requestParams, null, 2));
      console.log('[图片导入] 请求体:', JSON.stringify({
        appKey: api.appKey,
        sign: api.sign,
        worksheetId: 'scgl',
        filters: filters,
        pageSize: 50,
        pageIndex: 1
      }, null, 2));

      try {
        const result = await api.getData(requestParams);

        console.log('[图片导入] API返回结果:', JSON.stringify(result, null, 2));

        if (result.success && result.data && result.data.rows) {
          console.log('[图片导入] 成功获取', result.data.rows.length, '条记录');

          const processedImages = result.data.rows.map(row => {
            const imgArray = JSON.parse(row.img);
            const firstImage = imgArray[0];
            const url = firstImage.large_thumbnail_full_path;

            return {
              mingcheng: row.mingcheng || '',
              leibie: row.leibie || '',
              rowid: row.rowid || '',
              url: url || ''
            };
          });

          window.userImages = processedImages;
          console.log('[图片导入] 处理后的用户图片数据:', JSON.stringify(window.userImages, null, 2));

          console.log('[图片导入] 全局数据:', JSON.stringify({
            merchantId: window.merchantId,
            userImages: window.userImages
          }, null, 2));

          renderUserImages();
          renderTabBar();
          renderTabBarProperties();
        } else {
          console.error('[图片导入] 获取图片失败:', result.error_msg);
        }
      } catch (error) {
        console.error('[图片导入] 调用异常:', error);
      }
    }

    function renderUserImages() {
      console.log('[图片导入] 开始渲染用户图片');

      if (!window.userImages || window.userImages.length === 0) {
        console.warn('[图片导入] 没有用户图片数据');
        return;
      }

      window.userImages.forEach((image, index) => {
        console.log('[图片导入] 图片', index + 1, ':', image.mingcheng, image.rowid, image.url);
      });
    }

    // 自定义颜色选择器弹窗
    let currentColorPickerKey = null;
    let currentColorPickerValue = '';
    let currentPreviewElement = null;

    function showColorPickerPopup(event, key, currentValue) {
      event.preventDefault();
      event.stopPropagation();

      currentColorPickerKey = key;
      currentColorPickerValue = currentValue;
      currentPreviewElement = event.target;

      const popup = document.getElementById('colorPickerPopup');
      const colorInput = document.getElementById('popupColorInput');

      colorInput.value = currentValue;

      // 计算弹窗位置
      const rect = event.target.getBoundingClientRect();
      const popupWidth = 300;
      const popupHeight = 150;

      let left = rect.left;
      let top = rect.bottom + 5;

      // 确保不超出屏幕右侧
      if (left + popupWidth > window.innerWidth) {
        left = window.innerWidth - popupWidth - 10;
      }

      // 确保不超出屏幕底部
      if (top + popupHeight > window.innerHeight) {
        top = rect.top - popupHeight - 5;
      }

      popup.style.left = left + 'px';
      popup.style.top = top + 'px';
      popup.style.display = 'block';

      // 点击外部关闭弹窗
      setTimeout(() => {
        document.addEventListener('click', hideColorPickerPopupOutside);
      }, 0);
    }

    function hideColorPickerPopupOutside(event) {
      const popup = document.getElementById('colorPickerPopup');
      if (!popup.contains(event.target) && !event.target.classList.contains('color-picker-preview')) {
        hideColorPickerPopup();
      }
    }

    function hideColorPickerPopup() {
      const popup = document.getElementById('colorPickerPopup');
      popup.style.display = 'none';
      document.removeEventListener('click', hideColorPickerPopupOutside);
    }

    function applyColorPickerValue(value) {
      if (!currentColorPickerKey) {
        return;
      }

      if (currentColorPickerKey.startsWith('tabBar.')) {
        const key = currentColorPickerKey.replace('tabBar.', '');
        updateTabBarProperty(key, value);
      } else {
        updateGlobalProperty(currentColorPickerKey, value);
      }
    }

    function confirmColorPicker() {
      const colorInput = document.getElementById('popupColorInput');
      const value = colorInput.value;

      applyColorPickerValue(value);

      hideColorPickerPopup();
    }

    function onColorInputInput(event) {
      const value = event.target.value;
      applyColorPickerValue(value);
    }

    function onColorInputChange(event) {
      const value = event.target.value;
      applyColorPickerValue(value);
    }
  </script>

  <!-- 自定义颜色选择器弹窗 -->
  <div id="colorPickerPopup" class="color-picker-popup" style="display: none;">
    <div class="color-picker-popup-header">
      <span>选择颜色</span>
    </div>
    <div class="color-picker-popup-body">
      <input type="color" id="popupColorInput" class="popup-color-input" oninput="onColorInputInput(event)"
        onchange="onColorInputChange(event)" />
    </div>
    <div class="color-picker-popup-footer">
      <button class="btn btn-cancel" onclick="hideColorPickerPopup()">取消</button>
      <button class="btn btn-confirm" onclick="confirmColorPicker()">确定</button>
    </div>
  </div>
</body>

</html>
