<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片转二维数组工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .upload-section {
            border: 2px dashed #667eea;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            background: #f8f9fa;
            transition: all 0.3s;
        }

        .upload-section:hover {
            border-color: #764ba2;
            background: #f0f0f0;
        }

        .upload-section.dragover {
            border-color: #764ba2;
            background: #e8e8e8;
        }

        input[type="file"] {
            display: none;
        }

        .upload-btn {
            display: inline-block;
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
            margin: 10px;
        }

        .upload-btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .settings {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .setting-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .setting-item label {
            font-weight: bold;
            color: #555;
        }

        .setting-item input {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 100px;
        }

        .preview-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .preview-box {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            background: #f8f9fa;
        }

        .preview-box h3 {
            margin-bottom: 15px;
            color: #333;
            font-size: 18px;
        }

        canvas {
            border: 1px solid #ddd;
            border-radius: 4px;
            display: block;
            margin: 0 auto;
            background: #fff;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        .result-section {
            margin-top: 30px;
        }

        .result-section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 22px;
        }

        .code-block {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.6;
            max-height: 400px;
            overflow-y: auto;
        }

        .code-block::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        .code-block::-webkit-scrollbar-track {
            background: #1e1e1e;
        }

        .code-block::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 4px;
        }

        .copy-btn {
            margin-top: 10px;
            padding: 8px 20px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .copy-btn:hover {
            background: #218838;
        }

        .copy-btn:active {
            transform: scale(0.95);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-item .label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        .stat-item .value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .color-palette {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 10px;
        }

        .color-item {
            width: 30px;
            height: 30px;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
        }

        .color-item:hover::after {
            content: attr(data-color);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            white-space: nowrap;
            margin-bottom: 5px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .loading.active {
            display: block;
        }

        @media (max-width: 768px) {
            .preview-section {
                grid-template-columns: 1fr;
            }

            .settings {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 图片转二维数组工具</h1>

        <div class="upload-section" id="uploadSection">
            <p style="margin-bottom: 20px; color: #666;">拖拽图片到此处或点击按钮选择</p>
            <input type="file" id="fileInput" accept="image/*">
            <label for="fileInput" class="upload-btn">选择图片</label>
        </div>

        <div class="settings" id="settings" style="display: none;">
            <div class="setting-item">
                <label>像素大小:</label>
                <input type="number" id="pixelSize" value="10" min="1" max="50">
            </div>
            <div class="setting-item">
                <label>最大宽度:</label>
                <input type="number" id="maxWidth" value="58" min="10" max="200">
            </div>
            <div class="setting-item">
                <label>最大高度:</label>
                <input type="number" id="maxHeight" value="80" min="10" max="200">
            </div>
            <button class="upload-btn" onclick="processImage()">转换</button>
        </div>

        <div class="loading" id="loading">处理中...</div>

        <div class="stats" id="stats" style="display: none;">
            <div class="stat-item">
                <div class="label">宽度</div>
                <div class="value" id="statWidth">-</div>
            </div>
            <div class="stat-item">
                <div class="label">高度</div>
                <div class="value" id="statHeight">-</div>
            </div>
            <div class="stat-item">
                <div class="label">总像素</div>
                <div class="value" id="statTotal">-</div>
            </div>
            <div class="stat-item">
                <div class="label">颜色数</div>
                <div class="value" id="statColors">-</div>
            </div>
        </div>

        <div class="preview-section" id="previewSection" style="display: none;">
            <div class="preview-box">
                <h3>原始图片</h3>
                <canvas id="originalCanvas"></canvas>
            </div>
            <div class="preview-box">
                <h3>像素化预览</h3>
                <canvas id="pixelCanvas"></canvas>
            </div>
        </div>

        <div class="result-section" id="resultSection" style="display: none;">
            <h2>📋 转换结果</h2>
            
            <h3 style="margin-top: 20px; margin-bottom: 10px;">颜色映射表</h3>
            <div class="color-palette" id="colorPalette"></div>
            
            <h3 style="margin-top: 20px; margin-bottom: 10px;">二维数组数据</h3>
            <div class="code-block" id="arrayCode"></div>
            <button class="copy-btn" onclick="copyToClipboard('arrayCode')">复制数组</button>

            <h3 style="margin-top: 20px; margin-bottom: 10px;">完整代码（包含颜色映射表）</h3>
            <div class="code-block" id="fullCode"></div>
            <button class="copy-btn" onclick="copyToClipboard('fullCode')">复制完整代码</button>
        </div>
    </div>

    <script>
        let imageData = null;
        let pixelData = null;
        let colorMap = null;

        const fileInput = document.getElementById('fileInput');
        const uploadSection = document.getElementById('uploadSection');
        const settings = document.getElementById('settings');
        const loading = document.getElementById('loading');
        const stats = document.getElementById('stats');
        const previewSection = document.getElementById('previewSection');
        const resultSection = document.getElementById('resultSection');

        // 文件选择
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                loadImage(e.target.files[0]);
            }
        });

        // 拖拽上传
        uploadSection.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadSection.classList.add('dragover');
        });

        uploadSection.addEventListener('dragleave', () => {
            uploadSection.classList.remove('dragover');
        });

        uploadSection.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadSection.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                loadImage(e.dataTransfer.files[0]);
            }
        });

        function loadImage(file) {
            if (!file.type.startsWith('image/')) {
                alert('请选择图片文件！');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    imageData = img;
                    showOriginalImage(img);
                    settings.style.display = 'flex';
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function showOriginalImage(img) {
            const canvas = document.getElementById('originalCanvas');
            const ctx = canvas.getContext('2d');
            
            const maxWidth = parseInt(document.getElementById('maxWidth').value);
            const maxHeight = parseInt(document.getElementById('maxHeight').value);
            
            let width = img.width;
            let height = img.height;
            
            // 按比例缩放
            if (width > maxWidth || height > maxHeight) {
                const ratio = Math.min(maxWidth / width, maxHeight / height);
                width = Math.floor(width * ratio);
                height = Math.floor(height * ratio);
            }
            
            canvas.width = width;
            canvas.height = height;
            ctx.drawImage(img, 0, 0, width, height);
        }

        function processImage() {
            if (!imageData) {
                alert('请先选择图片！');
                return;
            }

            loading.classList.add('active');
            resultSection.style.display = 'none';

            setTimeout(() => {
                const pixelSize = parseInt(document.getElementById('pixelSize').value);
                const maxWidth = parseInt(document.getElementById('maxWidth').value);
                const maxHeight = parseInt(document.getElementById('maxHeight').value);

                // 计算实际尺寸
                let width = imageData.width;
                let height = imageData.height;
                
                if (width > maxWidth || height > maxHeight) {
                    const ratio = Math.min(maxWidth / width, maxHeight / height);
                    width = Math.floor(width * ratio);
                    height = Math.floor(height * ratio);
                }

                // 创建临时canvas处理图片
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = width;
                tempCanvas.height = height;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.drawImage(imageData, 0, 0, width, height);

                // 获取像素数据
                const imageDataObj = tempCtx.getImageData(0, 0, width, height);
                const pixels = imageDataObj.data;

                // 转换为二维数组
                const result = convertTo2DArray(pixels, width, height);
                pixelData = result.pixelData;
                colorMap = result.colorMap;

                // 显示统计信息
                document.getElementById('statWidth').textContent = width;
                document.getElementById('statHeight').textContent = height;
                document.getElementById('statTotal').textContent = width * height;
                document.getElementById('statColors').textContent = Object.keys(colorMap).length;
                stats.style.display = 'grid';

                // 渲染像素化预览
                renderPixelPreview(width, height, pixelSize);

                // 显示结果
                displayResults();

                loading.classList.remove('active');
                previewSection.style.display = 'grid';
                resultSection.style.display = 'block';
            }, 100);
        }

        function convertTo2DArray(pixels, width, height) {
            const colorToIndex = {};
            const colorMap = {};
            let colorIndex = 0;

            // 创建二维数组
            const pixelData = Array(height).fill(null).map(() => Array(width).fill(0));

            // 遍历每个像素
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const index = (y * width + x) * 4;
                    const r = pixels[index];
                    const g = pixels[index + 1];
                    const b = pixels[index + 2];
                    const a = pixels[index + 3];

                    // 转换为十六进制颜色
                    const color = rgbToHex(r, g, b);

                    // 如果颜色不存在，添加到映射表
                    if (!colorToIndex[color]) {
                        colorToIndex[color] = colorIndex;
                        colorMap[colorIndex] = color;
                        colorIndex++;
                    }

                    // 设置像素数据
                    pixelData[y][x] = colorToIndex[color];
                }
            }

            return { pixelData, colorMap };
        }

        function rgbToHex(r, g, b) {
            return '#' + [r, g, b].map(x => {
                const hex = x.toString(16);
                return hex.length === 1 ? '0' + hex : hex;
            }).join('').toUpperCase();
        }

        function renderPixelPreview(width, height, pixelSize) {
            const canvas = document.getElementById('pixelCanvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = width * pixelSize;
            canvas.height = height * pixelSize;
            
            // 禁用抗锯齿，保持像素化效果
            ctx.imageSmoothingEnabled = false;

            // 渲染像素
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const colorIndex = pixelData[y][x];
                    ctx.fillStyle = colorMap[colorIndex];
                    ctx.fillRect(x * pixelSize, y * pixelSize, pixelSize, pixelSize);
                }
            }
        }

        function displayResults() {
            // 显示颜色映射表
            const colorPalette = document.getElementById('colorPalette');
            colorPalette.innerHTML = '';
            Object.entries(colorMap).forEach(([index, color]) => {
                const colorItem = document.createElement('div');
                colorItem.className = 'color-item';
                colorItem.style.backgroundColor = color;
                colorItem.setAttribute('data-color', `${index}: ${color}`);
                colorItem.title = `${index}: ${color}`;
                colorPalette.appendChild(colorItem);
            });

            // 格式化二维数组
            const arrayStr = formatArray(pixelData);
            document.getElementById('arrayCode').textContent = arrayStr;

            // 生成完整代码
            const colorMapStr = formatColorMap(colorMap);
            const fullCode = `// 颜色映射表\nconst colorMap = ${colorMapStr};\n\n// 二维数组数据\nconst pixelData = ${arrayStr};\n\n// 渲染函数\nfunction renderPixelArt(canvas, pixelData, colorMap) {\n  const ctx = canvas.getContext('2d');\n  const pixelSize = 10; // 像素大小\n  \n  // 禁用抗锯齿，保持像素化效果\n  ctx.imageSmoothingEnabled = false;\n  \n  pixelData.forEach((row, y) => {\n    row.forEach((colorIndex, x) => {\n      ctx.fillStyle = colorMap[colorIndex];\n      ctx.fillRect(x * pixelSize, y * pixelSize, pixelSize, pixelSize);\n    });\n  });\n}`;
            document.getElementById('fullCode').textContent = fullCode;
        }

        function formatArray(arr) {
            const lines = arr.map(row => {
                return '  [' + row.join(',') + ']';
            });
            return '[\n' + lines.join(',\n') + '\n]';
        }

        function formatColorMap(map) {
            const entries = Object.entries(map).map(([index, color]) => {
                return `  ${index}: '${color}'`;
            });
            return '{\n' + entries.join(',\n') + '\n}';
        }

        function copyToClipboard(elementId) {
            const element = document.getElementById(elementId);
            const text = element.textContent;
            
            navigator.clipboard.writeText(text).then(() => {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = '已复制！';
                btn.style.background = '#28a745';
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.style.background = '';
                }, 2000);
            }).catch(err => {
                alert('复制失败，请手动选择复制');
            });
        }
    </script>
</body>
</html>
