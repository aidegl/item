<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebSocket 测试 - 风给小粽发消息</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 30px;
    }
    h1 { color: #333; margin-bottom: 20px; }
    .status-bar {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-family: monospace;
      font-size: 14px;
    }
    .status-bar.connected { background: #e6fffa; border-left: 4px solid #48bb78; }
    .status-bar.disconnected { background: #fff5f5; border-left: 4px solid #f56565; }
    .input-area { display: flex; gap: 10px; margin-bottom: 20px; }
    textarea {
      flex: 1;
      padding: 12px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      resize: vertical;
      min-height: 80px;
      font-family: 'Monaco', monospace;
    }
    textarea:focus { outline: none; border-color: #667eea; }
    button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3); }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .log-area {
      background: #1a202c;
      border-radius: 8px;
      padding: 20px;
      max-height: 500px;
      overflow-y: auto;
      font-family: 'Monaco', monospace;
      font-size: 13px;
      line-height: 1.6;
    }
    .log-entry { margin-bottom: 8px; padding: 8px; border-radius: 4px; }
    .log-info { color: #63b3ed; }
    .log-success { color: #68d391; }
    .log-error { color: #fc8181; }
    .log-send { color: #f6e05e; }
    .log-receive { color: #9f7aea; }
    .log-time { color: #718096; font-size: 11px; margin-right: 8px; }
    .controls { display: flex; gap: 10px; margin-top: 20px; }
    .secondary-btn { background: #e2e8f0; color: #4a5568; }
    .secondary-btn:hover { background: #cbd5e0; }
    .speed-test { margin-top: 20px; padding: 15px; background: #f7fafc; border-radius: 8px; }
    .speed-btn { background: #4299e1; padding: 8px 16px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="container">
    <h1> WebSocket 测试 - 风给小粽发消息</h1>
    
    <div id="statusBar" class="status-bar disconnected">
      <span>状态: 🚫 断开连接</span>
      <span style="float: right; color: #718096;">ws://8.155.148.75/ws?client=miniprogram</span>
    </div>
    
    <div class="input-area">
      <textarea id="messageInput" placeholder="输入消息内容"></textarea>
      <button id="sendBtn">发送消息</button>
    </div>
    
    <div class="controls">
      <button id="connectBtn">连接 WebSocket</button>
      <button id="disconnectBtn" class="secondary-btn" disabled>断开连接</button>
      <button id="clearBtn" class="secondary-btn">清空日志</button>
    </div>
    
    <div class="speed-test">
      <strong>🚀 快速测试</strong>
      <div style="margin-top: 10px;">
        <button class="speed-btn" onclick="quickTest('你好小粽，这是风的 WebSocket 测试消息')">发送测试消息</button>
      </div>
    </div>
    
    <div class="log-area" id="logArea"></div>
  </div>

  <script>
    let ws = null;
    const WS_URL = 'ws://8.155.148.75/ws?client=miniprogram';
    
    const statusBar = document.getElementById('statusBar');
    const statusSpan = statusBar.querySelector('span:nth-child(1)');
    const sendBtn = document.getElementById('sendBtn');
    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const clearBtn = document.getElementById('clearBtn');
    const logArea = document.getElementById('logArea');
    const messageInput = document.getElementById('messageInput');
    
    function addLog(type, message) {
      const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
      const entry = document.createElement('div');
      entry.className = `log-entry log-${type}`;
      entry.innerHTML = `<span class="log-time">[${time}]</span>${message}`;
      logArea.appendChild(entry);
      logArea.scrollTop = logArea.scrollHeight;
    }
    
    function updateStatus(connected, text) {
      if (connected) {
        statusBar.className = 'status-bar connected';
        statusSpan.innerHTML = '✅ 状态: 已连接';
        connectBtn.disabled = true;
        disconnectBtn.disabled = false;
        sendBtn.disabled = false;
      } else {
        statusBar.className = 'status-bar disconnected';
        statusSpan.innerHTML = '🚫 状态: 断开连接';
        connectBtn.disabled = false;
        disconnectBtn.disabled = true;
        sendBtn.disabled = true;
      }
    }
    
    connectBtn.addEventListener('click', () => {
      if (ws) ws.close();
      ws = new WebSocket(WS_URL);
      
      ws.onopen = () => {
        addLog('info', '✅ WebSocket 连接成功！');
        updateStatus(true);
        setTimeout(() => {
          const handshake = { type: 'handshake', client: 'miniprogram', time: new Date().toISOString() };
          ws.send(JSON.stringify(handshake));
          addLog('send', ` sent: ${JSON.stringify(handshake)}`);
        }, 100);
      };
      
      ws.onmessage = (event) => {
        try { addLog('receive', ` received: ${JSON.parse(event.data)}`); }
        catch (e) { addLog('info', ` received: ${event.data}`); }
      };
      
      ws.onclose = () => { addLog('info', '⚠️ WebSocket 连接已关闭'); updateStatus(false); };
      ws.onerror = (error) => { addLog('error', `❌ 连接错误: ${error.message}`); };
    });
    
    disconnectBtn.addEventListener('click', () => { if (ws) { ws.close(); addLog('info', '断开连接中...'); } });
    
    sendBtn.addEventListener('click', () => {
      const message = messageInput.value.trim();
      if (!message) { addLog('error', '❌ 消息不能为空'); return; }
      if (ws && ws.readyState === WebSocket.OPEN) {
        const msg = { type: 'chat', data: message };
        ws.send(JSON.stringify(msg));
        addLog('send', ` sent: ${JSON.stringify(msg)}`);
        messageInput.value = '';
      } else { addLog('error', '❌ WebSocket 未连接'); }
    });
    
    clearBtn.addEventListener('click', () => { logArea.innerHTML = ''; addLog('info', '日志已清空'); });
    
    window.quickTest = function(text) {
      messageInput.value = text;
      sendBtn.click();
    };
    
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendBtn.click(); }
    });
    
    addLog('info', 'WebSocket 测试客户端已就绪');
    addLog('info', `目标地址: ${WS_URL}`);
    
    setTimeout(() => { connectBtn.click(); }, 500);
  </script>
</body>
</html>
